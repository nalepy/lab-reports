<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Laboratorio Clínico — Iniciar sesión</title>
<style>
:root {
  --ink: #10151c; --muted: #6b7684; --faint: #9aa4ad;
  --paper: #eaeef2; --surface: #ffffff; --line: #dbe1e7;
  --serum: #0a7d8c; --serum-deep: #075e69; --serum-brt: #14b8c4;
  --serum-wash: #e2f4f6; --red: #c5362b;
  --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(20,184,196,.10), transparent 60%),
    var(--paper);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
  -webkit-font-smoothing: antialiased;
}
.card {
  background: var(--surface); border-radius: 16px; border: 1px solid var(--line);
  padding: 40px 34px; width: 100%; max-width: 400px;
  box-shadow: 0 1px 2px rgba(16,21,28,.05), 0 30px 70px -30px rgba(16,21,28,.4);
  text-align: center; position: relative; overflow: hidden;
}
.card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--serum-brt), var(--serum-deep));
}
.mark {
  width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 18px;
  background: linear-gradient(145deg, var(--serum-brt), var(--serum-deep));
  display: grid; place-items: center; font-size: 26px;
  box-shadow: 0 10px 24px -10px rgba(10,125,140,.7);
}
.eyebrow {
  font-size: .66rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 6px;
}
h1 { font-size: 21px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); margin-bottom: 8px; }
p { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
input {
  width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px;
  font-size: 16px; margin-bottom: 16px; background: var(--surface); color: var(--ink);
  transition: border-color .15s, box-shadow .15s; font-family: var(--font-mono);
}
input::placeholder { font-family: system-ui, sans-serif; color: var(--faint); }
input:focus { outline: none; border-color: var(--serum-brt); box-shadow: 0 0 0 3px rgba(20,184,196,.30); }
button {
  width: 100%; padding: 13px; background: var(--serum); color: #fff; border: none;
  border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
  transition: background .15s, transform .05s;
}
button:hover { background: var(--serum-deep); }
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.6; cursor: wait; }
.error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 20px; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">🧪</div>
  <div class="eyebrow">Panel de Laboratorio Clínico</div>
  <h1>Acceso privado</h1>
  <p>Ingrese la contraseña para ver los informes.</p>
  <form onsubmit="return doLogin(event)">
    <input type="password" id="password" placeholder="Contraseña" autofocus required>
    <button type="submit" id="btnLogin">Ingresar</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
async function doLogin(ev) {
  ev.preventDefault();
  const pw = document.getElementById("password").value;
  const btn = document.getElementById("btnLogin");
  const err = document.getElementById("error");
  btn.disabled = true; btn.textContent = "Verificando…"; err.textContent = "";
  try {
    const fd = new FormData();
    fd.append("password", pw);
    const res = await fetch("/api/login", { method: "POST", body: fd, credentials: "same-origin" });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || "Contraseña incorrecta";
      btn.disabled = false; btn.textContent = "Ingresar";
      return;
    }
    // login exitoso: navegar al panel
    window.location.replace("/");
    // fallback: si el navegador no navegó en 2s, forzar
    setTimeout(() => { window.location.href = "/"; }, 2000);
  } catch (e) {
    err.textContent = "Error de conexión: " + (e.message || "intente de nuevo");
    btn.disabled = false; btn.textContent = "Ingresar";
  }
  return false;
}
</script>
</body>
</html>
